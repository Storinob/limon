name: Send Discord Release Announcement

on:
  release:
    types: [published, prereleased]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: ${{ github.event.release.name }}
          NOTES: ${{ github.event.release.body }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TEXT="@code-update
          # limon - $TITLE
          $NOTES

          https://github.com/Storinob/limon/releases/tag/$TAG"

          jq -n --arg content "$TEXT" '{content: $content}' > payload.json

          curl -H "Content-Type: application/json" -X POST -d @payload.json $DISCORD_WEBHOOK
