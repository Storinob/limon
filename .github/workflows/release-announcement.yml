name: Send Discord Release Announcement

on:
  release:
    types: [published, prereleased]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook via Node.js
        env:
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          DISCORD_WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          node -e '
            const https = require("https");

            const id = process.env.DISCORD_WEBHOOK_ID;
            const token = process.env.DISCORD_WEBHOOK_TOKEN;
            const title = process.env.RELEASE_TITLE || "";
            const tag = process.env.RELEASE_TAG || "";
            const body = process.env.RELEASE_BODY || "";

            const url = `https://discord.com/api/webhooks/${id}/${token}`;
            const content = `@code-update\n# limon - ${title}\n${body}\n\nhttps://github.com/Storinob/limon/releases/tag/${tag}`;

            const payload = JSON.stringify({ content });

            const req = https.request(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(payload)
              }
            }, (res) => {
              if (res.statusCode >= 400) {
                console.error(`Error status: ${res.statusCode}`);
                res.on("data", d => process.stdout.write(d));
                process.exit(1);
              } else {
                console.log("Успешно отправлено в Discord!");
              }
            });

            req.on("error", (e) => {
              console.error(e);
              process.exit(1);
            });

            req.write(payload);
            req.end();
          '
